name: Deploy to MonsterASP.NET

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore SmartCourt.sln

      - name: Build
        run: dotnet build SmartCourt.sln --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish SmartCourt/SmartCourt.csproj --configuration Release --no-build --output ./publish

      - name: Deploy via MSDeploy (Web Deploy)
        shell: cmd
        env:
          MONSTERASP_SERVER: ${{ secrets.MONSTERASP_SERVER }}
          MONSTERASP_SITENAME: ${{ secrets.MONSTERASP_SITENAME }}
          MONSTERASP_USERNAME: ${{ secrets.MONSTERASP_USERNAME }}
          MONSTERASP_PASSWORD: ${{ secrets.MONSTERASP_PASSWORD }}
        run: |
          "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe" -verb:sync -source:contentPath="%GITHUB_WORKSPACE%\publish" -dest:contentPath="%MONSTERASP_SITENAME%",ComputerName="https://%MONSTERASP_SERVER%:8172/msdeploy.axd?site=%MONSTERASP_SITENAME%",UserName="%MONSTERASP_USERNAME%",Password="%MONSTERASP_PASSWORD%",AuthType="Basic" -allowUntrusted -enableRule:AppOffline
