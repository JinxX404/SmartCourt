name: Deploy to MonsterASP.NET

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore SmartCourt.sln

      - name: Build
        run: dotnet build SmartCourt.sln --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish SmartCourt.API/SmartCourt.API.csproj --configuration Release --no-build --output ./publish

      - name: Deploy via MSDeploy (Web Deploy)
        run: |
          & "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe" `
            -verb:sync `
            -source:contentPath="${{ github.workspace }}\publish" `
            -dest:contentPath="${{ secrets.MONSTERASP_SITENAME }}",ComputerName="https://${{ secrets.MONSTERASP_SERVER }}/msdeploy.axd?site=${{ secrets.MONSTERASP_SITENAME }}",UserName="${{ secrets.MONSTERASP_USERNAME }}",Password="${{ secrets.MONSTERASP_PASSWORD }}",AuthType="Basic" `
            -allowUntrusted `
            -enableRule:AppOffline
